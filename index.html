<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G&amp;S · Control de HH</title>
<meta name="theme-color" content="#0f2d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control HH">
<style>
  html,body{margin:0;height:100%;background:#0f2d3a;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #inst{position:fixed;right:16px;bottom:16px;z-index:5;display:none;align-items:center;gap:10px;
        background:#e2661b;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:bold;
        box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
  #inst img{width:22px;height:22px;border-radius:5px;background:#fff}
  #inst .x{margin-left:4px;opacity:.8;font-weight:normal}
  #ios{position:fixed;left:16px;right:16px;bottom:16px;z-index:5;display:none;background:#fff;color:#18202f;border-radius:12px;
       padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:14px;line-height:1.4}
  #ios b{color:#e2661b}
  #ntf{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:6;display:none;width:min(440px,calc(100% - 24px));background:#fff;color:#18202f;
       border-radius:14px;padding:14px 16px;box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:14px;line-height:1.4;gap:12px;align-items:center}
  #ntf .ic{flex:none;width:40px;height:40px;border-radius:11px;background:#fde8da;display:grid;place-items:center;font-size:21px}
  #ntf b{display:block;font-size:15px}
  #ntf .bt{display:flex;gap:8px;margin-top:9px}
  #ntf button{border:0;border-radius:999px;padding:8px 14px;font-weight:bold;font-size:13.5px;cursor:pointer}
  #ntf .si{background:#e2661b;color:#fff}
  #ntf .no{background:#eef1f6;color:#5c6679}
</style>
</head>
<body>
<!-- ===== ENLACE DE LA APP (Apps Script) =====
     Si cambias de cuenta o de implementación, reemplaza SOLO el enlace que está en src="…/exec".
     El link de GitHub que usa tu equipo no cambia. -->
<iframe id="app" title="Control de HH" allow="clipboard-read; clipboard-write; fullscreen; downloads"
  src="https://script.google.com/macros/s/AKfycby0Fs14LFiA9tp0x9hVRbJW7g8fOOiclsbHkM4-jJiWccCaL6arafxrpxDLZ-uJQ1ISpQ/exec"></iframe>

<button id="inst" type="button"><img src="icon-192.png?v=2" alt="">Instalar la aplicación <span class="x" id="instx" title="Ahora no">✕</span></button>
<div id="ntf"><span class="ic">🔔</span><div><b>¿Activamos los avisos?</b>Te avisamos de HH por aprobar, observaciones, documentos por revisar y recordatorios para registrar tus horas.<div class="bt"><button class="si" id="ntf-si">Activar</button><button class="no" id="ntf-no">Ahora no</button></div></div></div>
<div id="ios">Para instalarla en tu iPhone: toca <b>Compartir</b> y luego <b>Agregar a inicio</b>. <span id="iosx" style="float:right;cursor:pointer">✕</span></div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  var ev = null, b = document.getElementById('inst');
  var instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  function no(){ try { return localStorage.getItem('gys-no-inst') === '1'; } catch(e){ return false; } }
  function setNo(){ try { localStorage.setItem('gys-no-inst', '1'); } catch(e){} }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); ev = e;
    if (!instalada && !no()) b.style.display = 'flex';
  });
  b.addEventListener('click', function(e){
    if (e.target.id === 'instx') { b.style.display = 'none'; setNo(); return; }
    if (!ev) return; ev.prompt(); ev.userChoice.finally(function(){ ev = null; b.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function(){ b.style.display = 'none'; });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !instalada && !no()) document.getElementById('ios').style.display = 'block';
  document.getElementById('iosx').onclick = function(){ document.getElementById('ios').style.display = 'none'; setNo(); };

  /* ---------- Avisos en el equipo (sin servicios externos) ----------
     La aplicación de Google le pide a esta página que muestre el aviso; el navegador pide permiso una sola vez. */
  var src = null, vistaPend = (location.hash || '').replace('#', '') || null;
  function okOrigen(o){ return /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o) || /^http:\/\/localhost(:\d+)?$/.test(o); }
  function permiso(){ return ('Notification' in window) ? Notification.permission : 'nosoporta'; }
  function enviar(m){ try { if (src) src.postMessage(m, '*'); } catch(e){} }
  var nb = document.getElementById('ntf');
  function banner(v){ nb.style.display = v ? 'flex' : 'none'; }
  function pedir(){
    banner(false);
    if (permiso() === 'nosoporta') { enviar({ gys: 'wrap', permiso: 'nosoporta' }); return; }
    Promise.resolve(Notification.requestPermission()).then(function(p){
      enviar({ gys: 'wrap', permiso: p });
      if (p === 'granted') mostrar({ titulo: 'Avisos activos ✅', cuerpo: 'Te avisaremos de HH por aprobar, observaciones, documentos y recordatorios.' });
    });
  }
  function mostrar(d){
    if (permiso() !== 'granted') return;
    var titulo = d.titulo || 'G&S · Control de HH';
    var op = { body: d.cuerpo || '', icon: 'icon-192.png?v=2', badge: 'icon-192.png?v=2', tag: 'gys-' + (d.vista || 'aviso'), renotify: true, data: { vista: d.vista || '' } };
    var simple = function(){ try { var n = new Notification(titulo, op); n.onclick = function(){ window.focus(); if (op.data.vista) enviar({ gys: 'ir', vista: op.data.vista }); n.close(); }; } catch(e){} };
    if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(function(reg){ return reg.showNotification(titulo, op); }).catch(simple);
    else simple();
  }
  document.getElementById('ntf-si').onclick = pedir;
  document.getElementById('ntf-no').onclick = function(){ banner(false); try { localStorage.setItem('gys-no-push', String(Date.now())); } catch(e){} };
  function pospuesto(){ try { var t = +localStorage.getItem('gys-no-push'); return t && Date.now() - t < 3 * 864e5; } catch(e){ return false; } }   // vuelve a preguntar a los 3 días
  window.addEventListener('message', function(e){
    if (!okOrigen(e.origin)) return; var d = e.data || {};
    if (d.gys === 'hola') {
      src = e.source; var p = permiso(); enviar({ gys: 'wrap', permiso: p });
      if (p === 'default' && !pospuesto() && (instalada || !/iphone|ipad|ipod/i.test(navigator.userAgent))) banner(true);
      if (vistaPend) { enviar({ gys: 'ir', vista: vistaPend }); vistaPend = null; history.replaceState(null, '', location.pathname); }
    } else if (d.gys === 'pedir') pedir();
    else if (d.gys === 'aviso') mostrar(d);
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(e){ if (e.data && e.data.gys === 'ir') enviar(e.data); });
</script>
</body>
</html>
